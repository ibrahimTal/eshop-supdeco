rules:
  - id: sql-injection-taint
    mode: taint
    pattern-sources:
      - pattern: req.body
      - pattern: req.query
      - pattern: req.params
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: db.get($SQL, ...)
              - pattern: db.all($SQL, ...)
              - pattern: db.run($SQL, ...)
          - focus-metavariable: $SQL
    message: >-
      SQL Injection (CWE-89) — une donnée provenant de la requête HTTP
      atteint une requête SQL sans assainissement. Utiliser une requête
      préparée : db.get('SELECT ... WHERE email = ?', [email], callback)
    languages: [javascript]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: A03:2021

  - id: sql-injection-concatenation
    pattern-either:
      - pattern: db.get("..." + $INPUT + "...", ...)
      - pattern: db.run("..." + $INPUT + "...", ...)
      - pattern: db.all("..." + $INPUT + "...", ...)
      - pattern: $Q = `...${$INPUT}...`
    message: >-
      SQL Injection (CWE-89) — requête construite par concaténation ou
      template literal contenant une variable interpolée. Utiliser une
      requête préparée avec des paramètres liés (?).
    languages: [javascript]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: A03:2021

  - id: hardcoded-secret
    patterns:
      - pattern: |
          const $VAR = "$SECRET"
      - metavariable-regex:
          metavariable: $VAR
          regex: (JWT_SECRET|API_KEY|STRIPE_KEY|PASSWORD|TOKEN)
      - metavariable-regex:
          metavariable: $SECRET
          regex: .{8,}
    message: "Secret hardcodé détecté — utiliser les variables d'environnement"
    languages: [javascript]
    severity: ERROR
    metadata:
      cwe: CWE-798

  - id: hardcoded-secret-inline-arg
    pattern: jwt.sign($PAYLOAD, "$SECRET", ...)
    message: >-
      Secret JWT hardcodé en argument direct (CWE-798) — utiliser
      process.env.JWT_SECRET au lieu d'une chaîne littérale.
    languages: [javascript]
    severity: ERROR
    metadata:
      cwe: CWE-798

  - id: idor-missing-user-check
    pattern: |
      db.get('SELECT * FROM orders WHERE id = ?', [$ID], ...)
    message: "IDOR potentiel — vérifier que la ressource appartient à req.user.id"
    languages: [javascript]
    severity: WARNING
    metadata:
      cwe: CWE-639
      owasp: A01:2021